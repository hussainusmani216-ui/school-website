    </header>

    <section class="contact-container">
        <div class="contact-info">
            <h2>Get In Touch</h2>
            <p><i class="fas fa-map-marker-alt"></i> 123 Education Street, Model Town, City, Pakistan</p>
            <p><i class="fas fa-phone"></i> +92 300 1234567 / 042-1234567</p>
            <p><i class="fas fa-envelope"></i> info@eliteschool.edu.pk</p>
            <p><i class="fas fa-clock"></i> Mon - Sat: 08:00 AM - 02:00 PM</p>
            
            <div class="map">
                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3402.551346255147!2d74.30236121514792!3d31.4826352813813!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x39190143e88bc11d%3A0x7d06e23b20743b82!2sModel%20Town!5e0!3m2!1sen!2s!4v1625567890123" width="100%" height="250" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
            </div>
        </div>

        <div class="contact-form-box">
            <h3>Send Message</h3>
            <form id="contactForm">
                <input type="text" placeholder="Your Name" required>
                <input type="email" placeholder="Email Address" required>
                <input type="text" placeholder="Subject">
                <textarea placeholder="Your Message" rows="6" required></textarea>
                <button type="submit" class="submit-btn-large">Send Message</button>
            </form>
        </div>
    </section>

    <script src="script.js"></script>
</body>
